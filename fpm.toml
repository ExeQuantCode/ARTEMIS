name = "artemis"
version = "2.0.0"
author = "Ned Thaddeus Taylor"
maintainer = "n.t.taylor@exeter.ac.uk"
description = "A Fortran library for generating interface lattice matches"

[preprocess]
[preprocess.cpp]
suffixes = ["F90", "f90"]

[library]
source-dir="src/fortran"

[dependencies]
openmp = "*"
coreutils = { git = "https://github.com/nedtaylor/coreutils", tag = "v0.1.0" }
atomstruc = { path = "../atomstruc" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[executable]]
name="artemis_executable"
source-dir="app"
main="main.f90"
